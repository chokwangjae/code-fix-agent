version = 1
state_dir = ".fix-agent"
codex_executable = "/opt/homebrew/bin/codex"

[server]
host = "127.0.0.1"
port = 7081
token_env = "CODE_FIX_TOKEN"
max_body_bytes = 1048576

[[repositories]]
id = "matrix-mobile-v2"
github = "inswave/Matrix_Mobile_V2"
target_branch = "dev"
local_path = "../Matrix_Mobile_V2"
remote = "origin"
publish_mode = "direct"
github_token_env = "MATRIX_MOBILE_FIX_GITHUB_TOKEN"
additional_instructions = "변경 영역의 전문 역할과 별도 structure-sync-checker 검증을 적용하고 문서·산출물 동기화 규칙을 지킨다."
commit_message_template = """fix(autofix): 리뷰 이슈 {fingerprint_short} 수정

무엇: 검증된 리뷰 이슈 {fingerprint_short} 수정
왜: 독립 사실 검증을 통과한 결함 해소
동기화: 변경 영역의 코드·테스트·문서 동기화
검증: 저장소 하네스 검증"""
test_commands = [
  ["bash", "tools/harness/check-structure.sh"],
  ["bash", "tools/harness/tests/test-workspace-reports.sh"],
  ["bash", "tools/harness/tests/test-ios-uikit-js-bridge-structure.sh"],
  ["bash", "tools/harness/tests/test-structure-sync-gate.sh"],
  ["bash", "tools/harness/tests/test-code-comment-contract.sh"],
  ["bash", "tools/harness/tests/test-git-policy.sh"],
  ["env", "MATRIX_ASSIGNED_AGENT=structure-sync-checker", "bash", "tools/harness/structure-sync-gate.sh", "record", "--cached"],
]

[repositories.execution]
command_timeout_seconds = 3600
max_attempts = 1
max_remote_merge_attempts = 3

[repositories.policy]
allowed_severities = ["Major", "Minor"]
allowed_paths = ["**"]
denied_paths = [
  ".github/workflows/**",
  ".env*",
  "**/.env*",
  "**/*.p12",
  "**/*.mobileprovision",
]
skipped_paths = [
  "AGENTS.md",
  "CLAUDE.md",
  ".agents/**",
  ".claude/**",
]
skipped_fingerprints = []
max_changed_files = 10
max_changed_lines = 500
allow_new_files = false
allow_deletions = false
require_finding_file_changed = true

[[repositories]]
id = "testsquare-fable"
github = "inswave/TestSquare-Fable"
target_branch = "dev"
local_path = "../TestSquare-Fable"
remote = "origin"
publish_mode = "direct"
github_token_env = "TESTSQUARE_FABLE_FIX_GITHUB_TOKEN"
additional_instructions = "변경 영역의 전문 역할과 최소 하네스를 적용하고 관련 저장소 문서를 함께 갱신한다."
commit_message_template = """fix(autofix): 리뷰 이슈 {fingerprint_short} 수정

이슈: autofix-{fingerprint_short}
무엇: 검증된 리뷰 이슈 수정
왜: 독립 사실 검증을 통과한 결함 해소
동기화: 변경 영역의 코드·테스트·문서 동기화
검증: 저장소 하네스 검증"""
test_commands = [
  ["node", "tools/harness/cli.mjs", "validate", "plan"],
  ["node", "tools/harness/cli.mjs", "validate", "run"],
  ["node", "tools/harness/cli.mjs", "validate", "check"],
]

[repositories.execution]
command_timeout_seconds = 3600
max_attempts = 1
max_remote_merge_attempts = 3

[repositories.policy]
allowed_severities = ["Major", "Minor"]
allowed_paths = ["**"]
denied_paths = [
  ".github/workflows/**",
  ".env*",
  "**/.env*",
  "**/*.p12",
  "**/*.mobileprovision",
]
skipped_paths = [
  "AGENTS.md",
  ".agents/**",
  ".claude/**",
  "tools/harness/policy.json",
]
skipped_fingerprints = []
max_changed_files = 10
max_changed_lines = 500
allow_new_files = false
allow_deletions = false
require_finding_file_changed = true
