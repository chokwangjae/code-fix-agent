version = 1
state_dir = ".fix-agent"
# codex_executable = "/absolute/path/to/codex"

[server]
host = "127.0.0.1"
port = 7081
# token = "replace-with-a-long-random-secret"
token_env = "CODE_FIX_TOKEN"
max_body_bytes = 1048576
max_concurrent_jobs = 3

[crontrol]
enabled = true
base_url = "http://127.0.0.1:7070"
job_id = "code-fix-agent-server"
name = "Code Fix Agent"
branch = "main"
# token = "replace-with-crontrol-api-token"
# token_env = "CRONTROL_API_TOKEN"
timeout_seconds = 5

[[repositories]]
id = "matrix-mobile-v2"
github = "inswave/Matrix_Mobile_V2"
target_branch = "dev"
local_path = "../Matrix_Mobile_V2"
remote = "origin"
publish_mode = "direct"
# github_token = "replace-with-a-repository-scoped-token"
# github_token_env = "MATRIX_FIX_GITHUB_TOKEN"
test_commands = []
additional_instructions = ""
commit_message_template = """{title}

무엇: 검증된 리뷰 이슈 수정
왜: 독립 사실 검증을 통과한 결함 해소
동기화: 변경 영역의 코드·테스트·문서 동기화
검증: 저장소 하네스 검증"""
git_author_name = "broken-agent"
git_author_email = "g_uapm@inswave.com"
setup_commands = [
  ["flutter", "pub", "get", "-C", "client/matrix_flutter_template"],
  ["npm", "install", "--prefix", "client/matrix_rn_template", "--no-package-lock", "--prefer-offline", "--no-audit", "--no-fund"],
]
setup_watch_paths = [
  "client/matrix_flutter_template/pubspec.yaml",
  "client/matrix_flutter_template/pubspec.lock",
  "client/matrix_rn_template/package.json",
]

[repositories.discord]
enabled = true
# 아래 두 키 중 하나만 사용한다.
# webhook_url = "https://discord.com/api/webhooks/..."
webhook_url_env = "MATRIX_FIX_DISCORD_WEBHOOK_URL"
timeout_seconds = 30

[repositories.execution]
command_timeout_seconds = 7200
setup_max_attempts = 3
setup_retry_delay_seconds = 15
max_attempts = 0
retry_delay_seconds = 30
max_remote_merge_attempts = 3

[repositories.policy]
allowed_severities = ["Major", "Minor"]
allowed_paths = ["**"]
denied_paths = [
  ".github/workflows/**",
  ".env*",
  "**/*.p12",
  "**/*.mobileprovision",
  "**/.env*",
]
skipped_paths = []
skipped_fingerprints = []
# 0이면 변경량을 제한하지 않는다.
max_changed_files = 0
max_changed_lines = 0
allow_new_files = true
allow_deletions = true
require_finding_file_changed = true
