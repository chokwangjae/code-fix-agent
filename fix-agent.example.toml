version = 1
state_dir = ".fix-agent"
# codex_executable = "/absolute/path/to/codex"

[server]
host = "127.0.0.1"
port = 7081
token_env = "CODE_FIX_TOKEN"
max_body_bytes = 1048576

[[repositories]]
id = "matrix-mobile-v2"
github = "inswave/Matrix_Mobile_V2"
target_branch = "dev"
local_path = "../Matrix_Mobile_V2"
remote = "origin"
publish_mode = "direct"
github_token_env = "MATRIX_FIX_GITHUB_TOKEN"
test_commands = []
additional_instructions = ""
commit_message_template = "fix: resolve review finding {fingerprint_short}"

[repositories.discord]
enabled = true
webhook_url_env = "MATRIX_FIX_DISCORD_WEBHOOK_URL"
timeout_seconds = 30

[repositories.execution]
command_timeout_seconds = 1800
max_attempts = 1
max_remote_merge_attempts = 3

[repositories.policy]
allowed_severities = ["Major", "Minor"]
allowed_paths = ["**"]
denied_paths = [
  ".github/workflows/**",
  ".env*",
  "**/*.p12",
  "**/*.mobileprovision",
  "**/.env*",
]
skipped_paths = []
skipped_fingerprints = []
max_changed_files = 10
max_changed_lines = 500
allow_new_files = false
allow_deletions = false
require_finding_file_changed = true
