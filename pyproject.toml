[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-fix-agent"
version = "0.1.0"
description = "Apply validated code review findings and publish verified fixes"
requires-python = ">=3.11"

[project.scripts]
fix-agent = "fix_agent.cli:main"
fix-agent-launchd = "fix_agent.launchd:main"

[tool.setuptools.packages.find]
where = ["src"]
